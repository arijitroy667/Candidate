services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - redis
